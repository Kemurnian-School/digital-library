services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    networks:
      - laravel
    depends_on:
      - mysql
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel
    restart: unless-stopped

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    networks:
      - laravel
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    command: sh -c "npm run build"
    deploy:
      resources:
        limits:
          memory: 512M

  mysql:
    image: mysql:5.7
    command: --innodb_buffer_pool_size=128M
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel
    restart: unless-stopped

volumes:
  mysql_data:
  node_modules:

networks:
  laravel:
    driver: bridge
